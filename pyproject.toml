[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-prediction"
version = "0.1.0"
description = "Canadian wildfire spread prediction: benchmark dataset and ML baseline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Deep learning
    "torch>=2.3",
    "torchvision>=0.18",
    # Classical ML
    "scikit-learn>=1.5",
    "scipy>=1.11",
    # Numerical / data
    "numpy>=1.26",
    "pandas>=2.2",
    # Geospatial raster
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=0.14",
    # NetCDF / ERA5
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "cdsapi>=0.7",
    # Config / experiment tracking
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.13",
    # Visualization
    "matplotlib>=3.8",
    "folium>=0.16",
    # HTTP / downloads
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "black>=24.0",
    "ruff>=0.4",
]

# Raw-data preparation: scripts/prepare_ndvi.py reads MODIS HDF4, which rasterio's GDAL wheels cannot
data = [
    "pyhdf>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
