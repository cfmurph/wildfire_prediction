name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: API tests and coverage
        run: >
          python -m pytest -c api/pytest.ini --rootdir api api/api_tests
          --cov-report=xml:coverage.xml
      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: coverage.xml

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install metric-test dependencies
        run: python -m pip install pytest numpy scikit-learn
      - name: Research metric tests
        run: python -m pytest tests/test_metrics.py -q
      - name: Research dataset tests when torch is installed
        run: |
          if python -c "import torch" 2>/dev/null; then
            python -m pytest tests/test_dataset.py -q
          else
            echo "torch is not installed; skipping tests/test_dataset.py (PyTorch dataset and augmentation tests)."
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end map page
        run: npm run test:e2e
