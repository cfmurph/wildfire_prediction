# @package _global_
defaults:
  - _self_

model:
  name: unet
  in_channels: 18
  base_filters: 32          # doubles at each encoder level: 32→64→128→256
  depth: 4                  # number of encoder/decoder levels
  dropout: 0.2

data:
  province: BC
  patch_size: 64
  channels:
    - elevation
    - slope
    - aspect
    - wind_dir
    - wind_speed
    - temp_min
    - temp_max
    - humidity
    - precip
    - FFMC
    - DMC
    - DC
    - ISI
    - BUI
    - FWI
    - NDVI
    - landcover
    - PrevFireMask
  train_years: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
  val_years: [2021, 2022]
  test_years: [2023]
  patches_dir: data/processed/patches
  splits_dir: data/processed/splits
  stats_dir: data/processed/stats

training:
  epochs: 50
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine          # cosine annealing
  dice_weight: 0.5           # loss = dice_weight*Dice + (1-dice_weight)*BCE
  early_stopping_patience: 8
  num_workers: 4
  seed: 42

augmentation:
  enabled: true
  hflip_prob: 0.5
  vflip_prob: 0.5
  rot90_prob: 0.5
  noise_std: 0.01            # Gaussian noise added to non-mask channels

mlflow:
  experiment_name: wildfire-phase1
  tracking_uri: experiments/mlruns
